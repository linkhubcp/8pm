<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>저녁 여덟시 — 링크</title>
<meta name="description" content="저녁 8시, 나만의 시간">
<meta name="theme-color" content="#f5efe4">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/moonspam/NanumSquareNeo@1.0/nanumsquareneo.css">
<style>
  * { box-sizing:border-box; }
  :root {
    --bg:#f5efe4; --fg:#23302f; --muted:#8b8478;
    --accent:#c9743f; --card:#ffffff; --card-hover:#fffdf8;
    --border:#e2d8c8; --shadow:0 1px 2px rgba(35,48,47,.05), 0 6px 16px rgba(35,48,47,.05); --thumb-bg:#f4f1eb;
  }
  body { margin:0; padding:56px 20px 64px; min-height:100vh;
         font-family:"NanumSquareNeo","Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; background:var(--bg); color:var(--fg);
         -webkit-font-smoothing:antialiased;
         display:flex; flex-direction:column; align-items:center; }
  .wrap { width:100%; max-width:412px; }

  /* 머리말만 가운데 정렬한다. 아래 목록은 전부 왼쪽 기준. */
  header { text-align:center; margin-bottom:36px; }
  img.avatar { width:96px; height:96px; border-radius:50%; object-fit:cover;
               border:3px solid var(--card); box-shadow:var(--shadow);
               margin-bottom:16px; }
  h1 { font-family:"Gowun Batang","Nanum Myeongjo","Apple SD Gothic Neo","Malgun Gothic",serif; font-size:26px; font-weight:700;
       margin:0 0 7px; letter-spacing:0.04em; }
  p.tag { font-size:13px; color:var(--muted); margin:0; letter-spacing:0.01em; }

  /* 흰 카드 + 아주 옅은 그림자. 밝은 배경에서는 선을 굵게 그리는 것보다
     그림자로 살짝 띄우는 쪽이 정돈돼 보인다. */
  a.btn { display:flex; align-items:center; gap:14px;
          padding:12px 16px 12px 12px; margin-bottom:12px; border-radius:16px;
          background:var(--card); color:var(--fg); text-decoration:none;
          border:1px solid var(--border); box-shadow:var(--shadow);
          transition:transform .14s ease, box-shadow .14s ease, border-color .14s ease; }
  a.btn:hover { background:var(--card-hover); border-color:var(--accent);
                transform:translateY(-2px);
                box-shadow:0 2px 4px rgba(35,48,47,.06), 0 12px 26px rgba(35,48,47,.09); }
  a.btn:active { transform:translateY(0); }

  /* 상품 사진은 흰 바탕에 찍힌 게 대부분이라, 흰 카드 위에 그냥 얹으면 경계가 사라진다.
     옅은 판을 깔고 contain으로 얹어 잘리지도, 번지지도 않게 한다. */
  .thumb { flex:0 0 auto; width:60px; height:60px; border-radius:12px;
           background:var(--thumb-bg); border:1px solid var(--border);
           display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .thumb img { width:100%; height:100%; object-fit:contain; }
  .thumb.empty { background:var(--thumb-bg); }

  /* 왼쪽 정렬 + 두 줄까지. 글자 수가 달라도 시작점이 같아야 목록이 정돈돼 보인다. */
  .label { flex:1 1 auto; text-align:left; font-size:14.5px; font-weight:700;
           line-height:1.45; word-break:keep-all; }
  .chev { flex:0 0 auto; color:var(--muted); font-size:20px; line-height:1; }

  p.empty { color:var(--muted); font-size:13.5px; text-align:center; padding:30px 0; }
  input.search { width:100%; padding:12px 15px; margin-bottom:14px; border-radius:13px;
                 background:var(--card); border:1px solid var(--border);
                 box-shadow:var(--shadow);
                 color:var(--fg); font-family:inherit; font-size:13.5px; outline:none; }
  input.search:focus { border-color:var(--accent); }
  input.search::placeholder { color:var(--muted); }
  p.noresult { color:var(--muted); font-size:13px; text-align:center; padding:18px 0; }

  footer { margin-top:34px; padding-top:18px; border-top:1px solid var(--border);
           text-align:center; font-size:11px; color:var(--muted); line-height:1.9; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <img class="avatar" src="profile.jpg" alt="">
      <h1>저녁 여덟시</h1>
      <p class="tag">저녁 8시, 나만의 시간</p>
    </header>

      <a class="btn" data-t="아무것도 하기 싫을 때 꺼내는 만두" href="https://link.coupang.com/re/AFFSDP?lptag=AF0463714&amp;pageKey=158010844&amp;itemId=512566621&amp;traceid=V0-201-6035fcfe3f5ece78" rel="nofollow sponsored" target="_blank"><span class="thumb"><img src="https://thumbnail9.coupangcdn.com/thumbnails/remote/212x212ex/image/retail/images/7688001523475-8c22055f-0b8f-44a1-af43-0c1b321cf70d.JPG" alt="" loading="lazy"></span><span class="label">아무것도 하기 싫을 때 꺼내는 만두</span><span class="chev" aria-hidden="true">›</span></a>
    <p class="noresult" id="nr" hidden>찾는 게 없네요.</p>
    <footer>쿠팡 파트너스 활동으로 일정액의 수수료를 제공받습니다.<br>영상 속 장면은 AI로 만들었습니다.</footer>
  </div>

</body>
</html>
