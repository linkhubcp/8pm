<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>저녁 여덟시 — 링크</title>
<meta name="description" content="저녁 8시, 나만의 시간">
<meta name="theme-color" content="#1b3a3f">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/moonspam/NanumSquareNeo@1.0/nanumsquareneo.css">
<style>
  * { box-sizing:border-box; }
  :root {
    --bg:#1b3a3f; --fg:#f6efe4; --muted:#8fb0b3;
    --accent:#e8a765; --btn:#25494e; --btn-hover:#2d585e;
  }
  body { margin:0; padding:40px 20px 48px; min-height:100vh;
         font-family:"NanumSquareNeo","Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; background:var(--bg); color:var(--fg);
         -webkit-font-smoothing:antialiased;
         display:flex; flex-direction:column; align-items:center; }
  .wrap { width:100%; max-width:400px; }

  /* 머리말만 가운데 정렬한다. 아래 목록은 전부 왼쪽 기준. */
  header { text-align:center; margin-bottom:26px; }
  img.avatar { width:92px; height:92px; border-radius:50%; object-fit:cover;
               border:2px solid #e8a76540; margin-bottom:14px; }
  h1 { font-family:"Gowun Batang","Nanum Myeongjo","Apple SD Gothic Neo","Malgun Gothic",serif; font-size:25px; font-weight:700;
       margin:0 0 5px; letter-spacing:0.02em; }
  p.tag { font-size:13px; color:var(--muted); margin:0; letter-spacing:0.01em; }

  a.btn { display:flex; align-items:center; gap:13px;
          padding:11px 14px; margin-bottom:11px; border-radius:15px;
          background:var(--btn); color:var(--fg); text-decoration:none;
          border:1px solid #e8a7652b;
          transition:background .13s, transform .13s, border-color .13s; }
  a.btn:hover { background:var(--btn-hover); border-color:#e8a76566;
                transform:translateY(-1px); }
  a.btn:active { transform:translateY(0); opacity:.86; }

  /* 상품 사진은 흰 바탕에 찍힌 게 대부분 — 흰 판에 얹어야 어색하지 않고, contain이라 안 잘린다. */
  .thumb { flex:0 0 auto; width:58px; height:58px; border-radius:11px;
           background:#fff; display:flex; align-items:center; justify-content:center;
           overflow:hidden; }
  .thumb img { width:100%; height:100%; object-fit:contain; }
  .thumb.empty { background:#e8a7651f; }

  /* 왼쪽 정렬 + 두 줄까지 허용. 글자 수가 달라도 시작점이 같아야 목록이 정돈돼 보인다. */
  .label { flex:1 1 auto; text-align:left; font-size:14.5px; font-weight:700;
           line-height:1.42; word-break:keep-all; }
  .chev { flex:0 0 auto; color:var(--muted); font-size:19px; line-height:1; }

  p.empty { color:var(--muted); font-size:13.5px; text-align:center; padding:26px 0; }
  input.search { width:100%; padding:11px 14px; margin-bottom:13px; border-radius:12px;
                 background:var(--btn); border:1px solid #e8a7652b;
                 color:var(--fg); font-family:inherit; font-size:13.5px; outline:none; }
  input.search:focus { border-color:#e8a76588; }
  input.search::placeholder { color:var(--muted); }
  p.noresult { color:var(--muted); font-size:13px; text-align:center; padding:16px 0; }

  footer { margin-top:26px; padding-top:16px; border-top:1px solid #e8a7651f;
           text-align:center; font-size:11px; color:var(--muted); line-height:1.85; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <img class="avatar" src="profile.jpg" alt="">
      <h1>저녁 여덟시</h1>
      <p class="tag">저녁 8시, 나만의 시간</p>
    </header>

      <a class="btn" data-t="아무것도 하기 싫을 때 꺼내는 만두" href="https://link.coupang.com/re/AFFSDP?lptag=AF0463714&amp;pageKey=158010844&amp;itemId=512566621&amp;traceid=V0-201-6035fcfe3f5ece78" rel="nofollow sponsored" target="_blank"><span class="thumb"><img src="https://thumbnail9.coupangcdn.com/thumbnails/remote/212x212ex/image/retail/images/7688001523475-8c22055f-0b8f-44a1-af43-0c1b321cf70d.JPG" alt="" loading="lazy"></span><span class="label">아무것도 하기 싫을 때 꺼내는 만두</span><span class="chev" aria-hidden="true">›</span></a>
    <p class="noresult" id="nr" hidden>찾는 게 없네요.</p>
    <footer>쿠팡 파트너스 활동으로 일정액의 수수료를 제공받습니다.<br>영상 속 장면은 AI로 만들었습니다.</footer>
  </div>

</body>
</html>
